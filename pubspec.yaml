name: heritage_vault
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  image: ^4.3.0
  cupertino_icons: ^1.0.8
  sqflite_common_ffi: ^2.4.2
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: 12.0.0
  spreadsheet_decoder: ^2.3.0
  exif: ^3.3.0
  xml: ^6.6.1
  face_detection_tflite: ^6.8.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  google_mlkit_text_recognition: 0.17.1
  flutter_onnxruntime: ^1.8.4
  dartcv4: ^2.2.2
  shared_preferences: ^2.5.5
  pdfrx: ^2.4.5
  flutter_video_thumbnail_plus: ^1.0.6
  sqflite: ^2.4.3
  file_selector: ^1.1.0
  heic_native: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/heirloom_atlas_logo.png
    - assets/branding/heirloom_atlas_banner.png
    - assets/branding/family_heritage_banner.png
    - assets/models/
    - assets/photos_decor/
    - assets/family_tree_decor/
    - assets/atlas_book_decor/
    - assets/collections_decor/

hooks:
  user_defines:
    dartcv4:
      parallel_jobs: 1
      android:
        cmake_version: "3.22.1"
        ninja_version: "1.10.2"
      windows:
        cmake_version: "4.3.1"